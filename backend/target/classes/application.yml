server:
  port: ${PORT:${SERVER_PORT:8080}}

spring:
  application:
    name: bike-rental-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Europe/Bucharest
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:c29tZS1zdXBlci1zZWNyZXQta2V5LXRvLXNpZ24tam90LXRva2Vucy0yNTYtYml0cy1sb25nLWZvci1zZWN1cml0eQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
